<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 250px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; margin: 0; background-color: #f5f5f5; }
        h3 { margin-top: 0; font-size: 16px; color: #333; text-align: center; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover { background-color: #45a049; }
        button:active { transform: translateY(1px); }
        #status { margin-top: 15px; text-align: center; font-size: 13px; font-weight: 500; min-height: 18px; }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
        .loading { color: #1565c0; }
    </style>
</head>
<body>
    <h3>Copy to Excel</h3>
    <button id="copyBtn">Bấm để Copy Dữ liệu</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
