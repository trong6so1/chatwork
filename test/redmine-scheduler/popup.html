<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redmine Scheduler</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --bg-color: #f4f7f6;
      --text-color: #333;
    }
    body {
      width: 250px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: 1.2rem;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 5px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    label {
      font-size: 0.9rem;
      font-weight: bold;
    }
    input[type="datetime-local"] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    button {
      padding: 10px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #2980b9;
    }
    #status {
      font-size: 0.85rem;
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Redmine Scheduler</h3>
    <label for="alarmTime">Chọn thời gian:</label>
    <input type="datetime-local" id="alarmTime">
    <button id="setAlarm">Đặt lịch hẹn</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
